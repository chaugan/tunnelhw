name: Bug report
description: Something in the agent, relay, or MCP adapter does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security issues here; see
        [SECURITY.md](https://github.com/chaugan/tunnelhw/blob/main/SECURITY.md).

        TunnelHW spans two machines and a serial device, so most of these fields
        are required: without them a report usually cannot be reproduced.

  - type: checkboxes
    id: works-locally
    attributes:
      label: The device works locally first
      description: >
        Before anything else, confirm the device works on its own machine
        without TunnelHW: open it in a normal terminal (PuTTY, `screen`,
        `picocom`, Arduino Serial Monitor) and check you can talk to it.
        A device that is already busy, missing a driver, or lacking permissions
        (`dialout` group on Linux) will fail through TunnelHW too, and that is
        not a TunnelHW bug.
      options:
        - label: I opened the device in a normal terminal on the agent machine and it behaved as expected.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Include exact error text.
      placeholder: |
        1. Paired the agent over SSH, toggled amber-falcon to Exposed
        2. Asked the LLM to open_device("amber-falcon")
        3. Expected a session_id; got: ...
    validations:
      required: true

  - type: input
    id: topology
    attributes:
      label: Deployment topology
      description: >
        A = through SSH (agent's built-in SSH client, relay on loopback),
        B = direct WSS with TLS certs, C = overlay network
        (Tailscale/WireGuard). See the README.
      placeholder: "A"
    validations:
      required: true

  - type: input
    id: agent-os
    attributes:
      label: Agent machine (OS and version)
      description: The machine the hardware is plugged into.
      placeholder: "Windows 11 24H2 / Ubuntu 24.04 / macOS 15.3 (arm64)"
    validations:
      required: true

  - type: input
    id: relay-os
    attributes:
      label: Relay machine (OS and version)
      description: The machine running the relay and the LLM. Say so if it is the same machine as the agent.
      placeholder: "Debian 12 (amd64)"
    validations:
      required: true

  - type: input
    id: agent-version
    attributes:
      label: Agent version
      description: The release you downloaded, or the commit you built from.
      placeholder: "0.2.4 (tunnelhw-agent-windows-amd64.exe) / built from a1b2c3d"
    validations:
      required: true

  - type: input
    id: relay-version
    attributes:
      label: Relay version
      description: Mismatched agent and relay versions are a common cause, so please check both.
      placeholder: "0.2.4 (tunnelhw-relay-linux-amd64)"
    validations:
      required: true

  - type: input
    id: chipset
    attributes:
      label: Serial device (chipset and VID:PID)
      description: >
        From Device Manager on Windows, `lsusb` on Linux, or
        `system_profiler SPUSBDataType` on macOS. For a native COM port or a
        PCI/PCIe serial card say so and give the port name.
      placeholder: "CP2102N, 10c4:ea60, or: native motherboard UART, COM1"
    validations:
      required: true

  - type: dropdown
    id: fingerprint
    attributes:
      label: Fingerprint confidence shown in the web UI
      options:
        - Strong (USB serial number)
        - Medium (native/fixed port)
        - Weak (VID:PID + port path)
        - Not applicable / device not listed
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Agent and relay console output around the failure. Redact tokens,
        hostnames, and usernames. Pairing tokens and API tokens are
        credentials. This is rendered as a code block, no backticks needed.
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Firewalls, VPNs, MCP client and version, whether it ever worked before.
    validations:
      required: false
